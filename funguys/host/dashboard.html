<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUNGUYS // CLI MISSION CONTROL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
    }
    ::selection {
      background: #ffffff;
      color: #000000;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000000; border-left: 1px solid #333333; }
    ::-webkit-scrollbar-thumb { background: #ffffff; }
    input, select, textarea {
      background-color: #000000 !important;
      color: #ffffff !important;
      font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace !important;
    }
    input:focus, select:focus, textarea:focus {
      outline: 1px solid #ffffff !important;
    }
  </style>
</head>
<body class="min-h-screen bg-black text-white text-xs leading-relaxed">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ASCII_LOGO = String.raw`
  ______ _    _ _   _  _____ _    _ __     __ _____ 
 |  ____| |  | | \ | |/ ____| |  | |\ \   / // ____|
 | |__  | |  | |  \| | |  __| |  | | \ \_/ /| (___  
 |  __| | |  | | . ' | | |_ | |  | |  \   /  \___ \ 
 | |    | |__| | |\  | |__| | |__| |   | |   ____) |
 |_|     \____/|_| \_|\_____|\____/    |_|  |_____/ 
    `.trim();

    const ASCII_MUSHROOM = String.raw`
       .-"""-.
      / *   * \
     |  *   *  |
      '-._____.-'
        |   |
       /|   |\
    `.trim();

    function asciiBar(pct, width = 20) {
      const clamped = Math.max(0, Math.min(100, Number(pct) || 0));
      const filled = Math.round((clamped / 100) * width);
      const empty = Math.max(0, width - filled);
      return "[" + "#".repeat(filled) + ".".repeat(empty) + "] " + clamped.toFixed(1) + "%";
    }

    function StatusTag({ status }) {
      const s = String(status || "pending").toUpperCase();
      const inverted = s === "COMPLETED" || s === "IN_PROGRESS" || s === "WORKING";
      return (
        <span className={`px-1.5 py-0.5 text-[11px] font-bold border border-white ${inverted ? "bg-white text-black" : "bg-black text-white"}`}>
          [{s}]
        </span>
      );
    }

    function AsciiBox({ title, rightLabel, children }) {
      return (
        <div className="border border-white bg-black">
          <div className="border-b border-white px-3 py-1.5 flex flex-wrap items-center justify-between gap-2 bg-neutral-950">
            <span className="font-bold tracking-wider uppercase">
              +--[ {title} ]--+
            </span>
            {rightLabel && <span className="text-neutral-400">{rightLabel}</span>}
          </div>
          <div className="p-4">{children}</div>
        </div>
      );
    }

    function App() {
      const [state, setState] = useState(null);
      const [activeTab, setActiveTab] = useState("mission");
      const [wsConnected, setWsConnected] = useState(false);
      const [simLoading, setSimLoading] = useState(false);
      const [copied, setCopied] = useState(false);

      // Teammate invite generator state
      const [ownerName, setOwnerName] = useState("Alex");
      const [machineName, setMachineName] = useState("TITAN-PC");
      const [profileKey, setProfileKey] = useState("claude-max");
      const [initialPct, setInitialPct] = useState(15);

      // Graphify query state
      const [graphQuery, setGraphQuery] = useState("compute_metrics");
      const [graphMode, setGraphMode] = useState("query");
      const [graphTarget, setGraphTarget] = useState("create_item");
      const [graphResult, setGraphResult] = useState("");

      // Contracts editor state
      const [contractsDraft, setContractsDraft] = useState("");

      // Internet search state
      const [searchQuery, setSearchQuery] = useState("FastAPI WebSocket broadcast pattern");
      const [searchResults, setSearchResults] = useState([]);
      const [searching, setSearching] = useState(false);

      // Grill-Me Architect Interview state
      const [grillName, setGrillName] = useState("");
      const [grillIdea, setGrillIdea] = useState("");
      const [grillWorkspacePath, setGrillWorkspacePath] = useState("");
      const [continueExisting, setContinueExisting] = useState(false);
      const [selectedLocalWs, setSelectedLocalWs] = useState("");
      const [loadedWsFiles, setLoadedWsFiles] = useState([]);
      const [leadArchitectId, setLeadArchitectId] = useState("auto");
      const [customAnswer, setCustomAnswer] = useState("");
      const [grillLoading, setGrillLoading] = useState(false);
      const [grillPhaseStage, setGrillPhaseStage] = useState("IDLE");
      const [grillPhaseDetail, setGrillPhaseDetail] = useState("Ready — select a local workspace or enter a project spec.");
      const [grillError, setGrillError] = useState(null);
      const [spinnerTick, setSpinnerTick] = useState(0);
      const [elapsedTenths, setElapsedTenths] = useState(0);

      // Agent Comms & Main Query Router state
      const [chatQuestion, setChatQuestion] = useState("");
      const [chatTargetAgent, setChatTargetAgent] = useState("auto");
      const [askingAgent, setAskingAgent] = useState(false);

      const SPINNER_FRAMES = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"];
      const spinnerChar = SPINNER_FRAMES[spinnerTick % SPINNER_FRAMES.length];

      useEffect(() => {
        if (!grillLoading && !askingAgent) {
          setElapsedTenths(0);
          return;
        }
        const interval = setInterval(() => {
          setSpinnerTick((t) => t + 1);
          setElapsedTenths((e) => {
            const next = e + 2;
            if (grillLoading) {
              if (next === 6) {
                setGrillPhaseStage((prev) => (prev === "SCANNING_FILES" ? "CONNECTING_TO_HEAD_BOT" : prev));
                setGrillPhaseDetail((prev) =>
                  prev.includes("Scanning")
                    ? "Connecting to Lead Architect AI CLI process..."
                    : prev
                );
              } else if (next === 16) {
                setGrillPhaseStage((prev) =>
                  prev === "CONNECTING_TO_HEAD_BOT" || prev === "SCANNING_FILES" ? "HEAD_BOT_THINKING" : prev
                );
                setGrillPhaseDetail(
                  "Head Bot is analyzing workspace files & formulating architectural response..."
                );
              } else if (next === 60) {
                setGrillPhaseDetail(
                  "Head Bot is performing deep reasoning on your project architecture (waiting for JSON output)..."
                );
              }
            }
            return next;
          });
        }, 200);
        return () => clearInterval(interval);
      }, [grillLoading, askingAgent]);

      const fetchState = async () => {
        try {
          const res = await fetch("/api/state");
          const data = await res.json();
          setState(data);
          if (data.project?.contracts_markdown) {
            setContractsDraft(data.project.contracts_markdown);
          }
          if (data.grill?.current_phase_stage && data.grill.current_phase_stage !== "IDLE") {
            setGrillPhaseStage(data.grill.current_phase_stage);
            if (data.grill.current_phase_detail) setGrillPhaseDetail(data.grill.current_phase_detail);
            if (data.grill.last_error) setGrillError(data.grill.last_error);
          }
        } catch (err) {
          setGrillError(`Failed to fetch host state: ${err.message}`);
        }
      };

      useEffect(() => {
        fetchState();
        const proto = window.location.protocol === "https:" ? "wss" : "ws";
        const ws = new WebSocket(`${proto}://${window.location.host}/ws`);
        ws.onopen = () => setWsConnected(true);
        ws.onclose = () => setWsConnected(false);
        ws.onmessage = (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            if (msg.type === "state_sync") {
              setState(msg.state);
              if (msg.state?.project?.contracts_markdown) {
                setContractsDraft(msg.state.project.contracts_markdown);
              }
              if (msg.state?.grill) {
                if (msg.state.grill.current_phase_stage) {
                  setGrillPhaseStage(msg.state.grill.current_phase_stage);
                }
                if (msg.state.grill.current_phase_detail) {
                  setGrillPhaseDetail(msg.state.grill.current_phase_detail);
                }
                setGrillError(msg.state.grill.last_error || null);
              }
            } else if (msg.type === "grill_phase") {
              if (msg.stage) setGrillPhaseStage(msg.stage);
              if (msg.detail) setGrillPhaseDetail(msg.detail);
              if (msg.error !== undefined) setGrillError(msg.error);
              if (msg.grill) {
                setState((prev) => (prev ? { ...prev, grill: msg.grill } : prev));
              }
            } else {
              fetchState();
            }
          } catch (e) {}
        };
        return () => ws.close();
      }, []);

      const runHackathonSimulation = async () => {
        setSimLoading(true);
        try {
          const res = await fetch("/api/simulate/hackathon", { method: "POST" });
          const data = await res.json();
          setState(data);
        } finally {
          setSimLoading(false);
        }
      };

      const handleApprovePlan = async () => {
        const res = await fetch("/api/project/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contracts_markdown: contractsDraft }),
        });
        const data = await res.json();
        setState(data);
      };

      const handleTriggerBatonPass = async (agentId) => {
        await fetch(`/api/agents/${agentId}/quota`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            used_pct: 84.0,
            turns_delta: 5,
            rate_limited: false,
            handoff_notes: "Manual 80%+ soft-quota Baton Pass triggered from CLI Mission Control.",
          }),
        });
        fetchState();
      };

      const handleClaimHuman = async (taskId) => {
        const name = prompt("ENTER TEAMMATE HANDLE TO CLAIM TASK:", "USER");
        if (!name) return;
        await fetch(`/api/tasks/${taskId}/claim-human`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ human_name: name }),
        });
        fetchState();
      };

      const handleResetCircuitBreaker = async (taskId) => {
        await fetch(`/api/tasks/${taskId}/reset-circuit-breaker`, { method: "POST" });
        fetchState();
      };

      const handleRenameAgent = async (agent) => {
        const codename = prompt(
          `ENTER CODE NAME FOR NODE [${agent.machine_name}]:`,
          agent.machine_name
        );
        if (!codename) return;
        const owner = prompt(
          `ENTER OWNER LABEL (DEFAULT: '${codename}'):`,
          codename
        );
        await fetch(`/api/agents/${agent.id}/rename`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ codename, owner_name: owner || codename }),
        });
        fetchState();
      };

      const handleDeleteAgent = async (agent) => {
        await fetch(`/api/agents/${agent.id}`, { method: "DELETE" });
        fetchState();
      };

      const handleClearTasks = async () => {
        await fetch("/api/tasks", { method: "DELETE" });
        fetchState();
      };

      const handleCreateTask = async () => {
        const title = prompt("TASK TITLE (e.g. Build Auth Service):");
        if (!title) return;
        const description = prompt("TASK SPECIFICATION:", title) || title;
        const filesRaw = prompt("TARGET FILES (comma-separated):", "app.py") || "app.py";
        const tierStr = prompt("TIER (1 = Architect/Debug, 2 = Builder/QA):", "1") || "1";
        const depsRaw = prompt("DEPENDENCIES (comma-separated task IDs, or blank):", "") || "";
        const id = "task-" + Math.random().toString(36).substring(2, 6);
        await fetch("/api/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id,
            title,
            description,
            complexity_tier: Number(tierStr) === 2 ? 2 : 1,
            target_files: filesRaw.split(",").map((s) => s.trim()).filter(Boolean),
            dependencies: depsRaw.split(",").map((s) => s.trim()).filter(Boolean),
          }),
        });
        fetchState();
      };

      const handleLoadExistingWorkspace = (wsPath, autoStart = false) => {
        const list = state?.available_workspaces || [];
        const target = list.find((w) => w.path === wsPath) || list[0];
        if (!target) {
          setGrillError("No existing local workspace found to load. Enter a folder path manually below.");
          return;
        }
        const nextName = target.project_name || target.folder_name;
        const nextIdea = target.project_idea
          ? `Continue & complete existing project (${target.project_idea}) — inspect existing ${target.file_count} files and build what is missing`
          : `Continue and finish the half-completed project in ${target.folder_name}`;
        setSelectedLocalWs(target.path);
        setGrillWorkspacePath(target.path);
        setGrillName(nextName);
        setGrillIdea(nextIdea);
        setLoadedWsFiles(target.files || []);
        setContinueExisting(true);
        setGrillError(null);
        setGrillPhaseStage("WORKSPACE_LOADED");
        setGrillPhaseDetail(
          `Loaded local workspace '${target.folder_name}' (${target.file_count} files detected: ${(target.files || []).join(", ")}). Click [SCAN_EXISTING_PROJECT_&_START_CONTINUATION_INTERVIEW] below or edit the goal first!`
        );
        if (autoStart) {
          startGrillWithParams(nextName, nextIdea, target.path, true);
        }
      };

      const startGrillWithParams = async (pName, pIdea, wsPath, isCont) => {
        if (!pIdea || !pIdea.trim()) {
          setGrillError("Please enter a project specification or load an existing workspace first.");
          return;
        }
        setGrillLoading(true);
        setGrillError(null);
        setGrillPhaseStage("SCANNING_FILES");
        setGrillPhaseDetail(
          isCont
            ? `Scanning local workspace files at ${wsPath || "active workspace"}...`
            : "Initializing project workspace & connecting to Head Bot..."
        );
        try {
          const res = await fetch("/api/grill/start", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              project_name: (pName || "").trim() || "PROJECT",
              project_idea: pIdea.trim(),
              lead_architect_agent_id: leadArchitectId && leadArchitectId !== "auto" ? leadArchitectId : null,
              workspace_path: (wsPath || "").trim() || null,
              continue_existing: Boolean(isCont),
            }),
          });
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${await res.text()}`);
          }
          const data = await res.json();
          setState(data);
          setGrillPhaseStage(data.grill?.current_phase_stage || "AWAITING_USER_TURN");
          setGrillPhaseDetail(
            data.grill?.current_phase_detail ||
              `Turn ${data.grill?.current_question?.step || 1} ready — select an option or submit custom direction.`
          );
          if (data.grill?.last_error) setGrillError(data.grill.last_error);
        } catch (err) {
          setGrillPhaseStage("ERROR");
          setGrillPhaseDetail("Failed to start Grill-Me Architect interview.");
          setGrillError(err.message || String(err));
        } finally {
          setGrillLoading(false);
        }
      };

      const handleStartGrill = async (e) => {
        e.preventDefault();
        await startGrillWithParams(grillName, grillIdea, grillWorkspacePath, continueExisting);
      };

      const handleAnswerGrill = async (answerText) => {
        if (!answerText || !answerText.trim()) return;
        setGrillLoading(true);
        setGrillError(null);
        setGrillPhaseStage("CONNECTING_TO_HEAD_BOT");
        setGrillPhaseDetail(
          `Submitting your answer & consulting Head Bot for Turn #${(state?.grill?.qa_history?.length || 0) + 2}...`
        );
        try {
          const res = await fetch("/api/grill/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ answer: answerText.trim() }),
          });
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${await res.text()}`);
          }
          const data = await res.json();
          setCustomAnswer("");
          setState(data);
          setGrillPhaseStage(data.grill?.current_phase_stage || "AWAITING_USER_TURN");
          setGrillPhaseDetail(
            data.grill?.current_phase_detail ||
              `Turn ${data.grill?.current_question?.step || 1} ready from Head Bot.`
          );
          if (data.grill?.last_error) setGrillError(data.grill.last_error);
        } catch (err) {
          setGrillPhaseStage("ERROR");
          setGrillPhaseDetail("Error while waiting for Head Bot response.");
          setGrillError(err.message || String(err));
        } finally {
          setGrillLoading(false);
        }
      };

      const handleCompileGrillPlan = async () => {
        setGrillLoading(true);
        setGrillError(null);
        setGrillPhaseStage("COMPILING_CONTRACTS_&_DAG");
        setGrillPhaseDetail(
          "Head Bot is compiling CONTRACTS.md and multi-phase Task DAG from your interview decisions..."
        );
        try {
          const res = await fetch("/api/grill/compile", { method: "POST" });
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${await res.text()}`);
          }
          const data = await res.json();
          setState(data);
          if (data.project?.contracts_markdown) {
            setContractsDraft(data.project.contracts_markdown);
          }
          setGrillPhaseStage(data.grill?.current_phase_stage || "PLAN_COMPILED");
          setGrillPhaseDetail(
            data.grill?.current_phase_detail ||
              "Plan & multi-phase Task DAG compiled! Click [APPROVE_PLAN_&_UNLOCK_AIS] at top right."
          );
          if (data.grill?.last_error) setGrillError(data.grill.last_error);
        } catch (err) {
          setGrillPhaseStage("ERROR");
          setGrillPhaseDetail("Failed to compile CONTRACTS.md & Task DAG.");
          setGrillError(err.message || String(err));
        } finally {
          setGrillLoading(false);
        }
      };

      const handleAskAgent = async (e) => {
        if (e) e.preventDefault();
        if (!chatQuestion.trim()) return;
        setAskingAgent(true);
        try {
          await fetch("/api/chat/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question: chatQuestion.trim(),
              preferred_agent_id: chatTargetAgent,
            }),
          });
          setChatQuestion("");
          fetchState();
        } finally {
          setAskingAgent(false);
        }
      };

      const handleQuickAsk = async (qText) => {
        setAskingAgent(true);
        try {
          await fetch("/api/chat/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question: qText,
              preferred_agent_id: chatTargetAgent,
            }),
          });
          fetchState();
        } finally {
          setAskingAgent(false);
        }
      };

      const handleClearChat = async () => {
        await fetch("/api/chat", { method: "DELETE" });
        fetchState();
      };

      const handleRunGraphQuery = async (e) => {
        e.preventDefault();
        const endpoint = `/api/graphify/${graphMode}`;
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: graphQuery, target: graphTarget }),
        });
        const data = await res.json();
        setGraphResult(data.result || "");
      };

      const handleWebSearch = async (e) => {
        e.preventDefault();
        setSearching(true);
        try {
          const res = await fetch("/api/tools/web-search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: searchQuery, max_results: 5 }),
          });
          const data = await res.json();
          setSearchResults(data.results || []);
        } finally {
          setSearching(false);
        }
      };

      if (!state) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-black text-white font-mono">
            root@funguys:~# initializing mission_control... _
          </div>
        );
      }

      const { project, tasks = [], agents = [], contract_alerts = [], qa_reports = [], events = [], graph = {}, chat_history = [], lan_ip, public_url } = state;
      const isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
      const joinBaseUrl = public_url || ((isLocalhost && lan_ip && lan_ip !== "127.0.0.1") ? `http://${lan_ip}:${window.location.port || 8420}` : window.location.origin);
      const defaultJoinCmd = `irm "${joinBaseUrl}/join.ps1" | iex`;
      const customJoinCmd = `irm "${joinBaseUrl}/join.ps1?name=${encodeURIComponent(ownerName)}&codename=${encodeURIComponent(machineName)}&profile=${profileKey}&used_pct=${initialPct}" | iex`;

      return (
        <div className="min-h-screen flex flex-col bg-black text-white">
          {/* Terminal Top Header */}
          <header className="border-b border-white bg-black px-6 py-4">
            <div className="max-w-7xl mx-auto">
              <div className="flex flex-wrap items-start justify-between gap-6">
                <div className="flex items-start gap-4 overflow-x-auto">
                  <pre className="text-[10px] leading-[1.15] text-white select-none hidden sm:block">
                    {ASCII_MUSHROOM}
                  </pre>
                  <div>
                    <pre className="text-[10px] sm:text-xs leading-[1.1] font-bold text-white select-none">
                      {ASCII_LOGO}
                    </pre>
                    <div className="mt-2 flex flex-wrap items-center gap-3 text-xs">
                      <span>// MULTI-AI COLLABORATIVE ORCHESTRATOR v0.1.0</span>
                      <span className="px-1.5 py-0.5 border border-white font-bold">
                        {wsConnected ? "[LINK: ONLINE]" : "[LINK: RECONNECTING]"}
                      </span>
                    </div>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-3">
                  {!project?.plan_approved ? (
                    <button
                      onClick={handleApprovePlan}
                      className="px-3 py-2 border border-white bg-white text-black font-bold hover:bg-black hover:text-white transition"
                    >
                      [ APPROVE_PLAN_&_UNLOCK_AIS ]
                    </button>
                  ) : (
                    <span className="px-3 py-2 border border-white bg-black text-white font-bold">
                      [ PLAN_APPROVED :: AUTONOMOUS_MODE_ACTIVE ]
                    </span>
                  )}

                  <button
                    onClick={runHackathonSimulation}
                    disabled={simLoading}
                    className="px-3 py-2 border border-white bg-black text-white font-bold hover:bg-white hover:text-black transition disabled:opacity-50"
                  >
                    {simLoading ? "[ RUNNING_SIMULATION... ]" : "[ RUN_DEMO_SIMULATION ]"}
                  </button>
                </div>
              </div>

              <div className="mt-3 pt-2 border-t border-neutral-800 flex flex-wrap items-center justify-between gap-2 text-neutral-300">
                <div>
                  <span className="text-neutral-500">root@funguys:~#</span> QUICK_JOIN_POWERSHELL:{" "}
                  <code
                    title="Click to copy join command"
                    onClick={() => {
                      navigator.clipboard.writeText(defaultJoinCmd);
                      alert("Copied to clipboard!\n\n" + defaultJoinCmd);
                    }}
                    className="border border-neutral-700 px-2 py-0.5 text-white bg-neutral-950 cursor-pointer hover:border-white transition font-mono select-all"
                  >
                    {defaultJoinCmd}
                  </code>
                </div>
                <div className="text-neutral-400">
                  ACTIVE_PROJECT: <strong className="text-white">{project?.name || "NONE"}</strong>
                </div>
              </div>

              {/* CLI Navigation Tabs */}
              <div className="mt-4 flex flex-wrap gap-2 pt-2 border-t border-white">
                {[
                  { id: "mission", label: "01:MISSION_CTL" },
                  { id: "graphify", label: `02:GRAPHIFY_AST (${graph.node_count || 0})` },
                  { id: "qa", label: `03:QA_PIPELINE (${qa_reports.length})` },

                            type="button"
                            onClick={() => handleQuickAsk(q)}
                            className="px-2 py-0.5 border border-neutral-700 text-[11px] text-neutral-300 hover:border-white hover:bg-white hover:text-black transition"
                          >
                            [{q}]
                          </button>
                        ))}
                      </div>

                      {chat_history.length > 0 && (
                        <div className="space-y-3 pt-2 max-h-80 overflow-y-auto border-t border-neutral-800">
                          {[...chat_history].reverse().map((item) => (
                            <div key={item.id} className="border border-white p-3 bg-neutral-950 space-y-2">
                              <div className="flex flex-wrap items-center justify-between gap-2 border-b border-neutral-800 pb-1.5">
                                <span className="font-bold text-white">
                                  USER_QUERY &gt; {item.question}
                                </span>
                                <span className="text-neutral-500 text-[11px]">
                                  [{new Date(item.timestamp).toLocaleTimeString()}]
                                </span>
                              </div>
                              <div className="text-[11px] text-neutral-300 border-l-2 border-white pl-2 py-0.5">
                                <div>
                                  <span className="text-neutral-400">MAIN_ROUTER_DISPATCH:</span>{" "}
                                  <strong className="text-white">{item.matched_domain}</strong>
                                </div>
                                <div className="text-neutral-400">{item.routing_reason}</div>
                              </div>
                              <div className="bg-black border border-neutral-700 p-2.5 whitespace-pre-wrap text-white">
                                <div className="font-bold border-b border-neutral-800 pb-1 mb-1.5">
                                  MODEL_RESPONSE :: {item.agent_label}
                                </div>
                                {item.answer}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </AsciiBox>

                  {/* Task DAG Board */}
                  <AsciiBox
                    title="CONTRACT_FIRST_TASK_DAG_&_BATON_PASS_BOARD"
                    rightLabel={`TASKS: ${tasks.length}`}
                  >
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-4 pb-3 border-b border-neutral-800">
                      <span className="text-neutral-400">
                        Multi-Phase Freeform DAG | Full Workspace Sync | Lead Architect Audit &amp; All-Bots Consensus
                      </span>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={handleCreateTask}
                          className="px-2.5 py-1 border border-white hover:bg-white hover:text-black font-bold"
                        >
                          [+ MANUAL_TASK_OVERRIDE]
                        </button>
                        {tasks.length > 0 && (
                          <button
                            onClick={handleClearTasks}
                            className="px-2.5 py-1 border border-neutral-500 text-neutral-300 hover:border-white hover:bg-white hover:text-black"
                          >
                            [CLEAR_BOARD]
                          </button>
                        )}
                      </div>
                    </div>

                    <div className="space-y-3">
                      {tasks.length === 0 ? (
                        <div className="border border-dashed border-neutral-600 p-6 text-center text-neutral-400">
                          &gt; TASK_DAG_EMPTY. Run [ START_GRILL_ME_INTERVIEW ] above to auto-generate the project plan and tasks.
                        </div>
                      ) : (
                        tasks.map((task) => (
                          <div key={task.id} className="border border-white p-3.5 bg-black space-y-2">
                            <div className="flex flex-wrap items-start justify-between gap-2">
                              <div>
                                <div className="flex flex-wrap items-center gap-2">
                                  <span className="font-bold">{task.id}</span>
                                  <span className="px-1.5 py-0.5 border border-white bg-neutral-900 text-white text-[11px] font-bold">
                                    [PHASE_{task.phase || 1}]
                                  </span>
                                  <span className="px-1.5 py-0.5 border border-neutral-500 text-[11px]">
                                    [TIER_{task.complexity_tier}: {task.complexity_tier === 1 ? "ARCHITECT/CORE" : "BUILDER/QA"}]
                                  </span>
                                  <StatusTag status={task.status} />
                                </div>
                                <h3 className="font-bold text-sm mt-1.5">&gt; {task.title}</h3>
                                <p className="text-neutral-400 mt-0.5">{task.description}</p>
                              </div>

                              <div className="flex items-center gap-2">
                                {task.circuit_breaker_tripped && (
                                  <button
                                    onClick={() => handleResetCircuitBreaker(task.id)}
                                    className="px-2 py-1 border border-white bg-white text-black font-bold"
                                  >
                                    [RESET_CIRCUIT_BREAKER]
                                  </button>
                                )}
                                {task.status !== "completed" && !task.assigned_human && (
                                  <button
                                    onClick={() => handleClaimHuman(task.id)}
                                    className="px-2 py-1 border border-neutral-500 hover:border-white hover:bg-white hover:text-black"
                                  >
                                    [CLAIM_AS_HUMAN]
                                  </button>
                                )}
                              </div>
                            </div>

                            <div className="pt-2 border-t border-neutral-800 flex flex-wrap items-center justify-between gap-2 text-neutral-400">
                              <div className="flex flex-wrap gap-3">
                                <span>BRANCH: <code className="text-white">{task.branch_name}</code></span>
                                <span>FILES: <code className="text-white">{(task.target_files || []).join(", ")}</code></span>
                                {task.dependencies?.length > 0 && (
                                  <span>DEPS: <code className="text-white">{task.dependencies.join(", ")}</code></span>
                                )}
                                {task.verification_commands?.length > 0 && (
                                  <span>VERIFY: <code className="text-white">{task.verification_commands.join(" && ")}</code></span>
                                )}
                              </div>
                              <div>
                                {task.assigned_human ? (
                                  <span className="text-white font-bold">[HUMAN: {task.assigned_human}]</span>
                                ) : task.assigned_agent_id ? (
                                  <span className="text-white font-bold">[AGENT: {task.assigned_agent_id}]</span>
                                ) : (
                                  <span>[UNASSIGNED]</span>
                                )}
                                {task.retry_count > 0 && (
                                  <span className="ml-2 text-white">
                                    (RETRIES: {task.retry_count}/{task.max_retries})
                                  </span>
                                )}
                              </div>
                            </div>

                            {task.architect_review && (
                              <div className="border border-white p-2 mt-2 bg-neutral-950 text-[11px] text-neutral-200 whitespace-pre-wrap">
                                <span className="font-bold text-white">// ARCHITECT_PHASE_AUDIT_&_ALL_BOTS_CONSENSUS:</span>{"\n"}
                                {task.architect_review}
                              </div>
                            )}

                            {task.handoff_digest && (
                              <details className="border border-neutral-600 p-2 mt-2 bg-neutral-950">
                                <summary className="cursor-pointer font-bold text-white">
                                  [+] VIEW_BATON_PASS_GRAPHIFY_DIGEST
                                </summary>
                                <pre className="mt-2 whitespace-pre-wrap text-[11px] text-neutral-300">
                                  {task.handoff_digest}
                                </pre>
                              </details>
                            )}
                          </div>
                        ))
                      )}
                    </div>
                  </AsciiBox>

                  {/* Live Terminal Event Stream */}
                  <AsciiBox
                    title="REAL_TIME_ORCHESTRATOR_STDOUT"
                    rightLabel={`EVENTS: ${events.length}`}
                  >
                    <div className="space-y-1.5 max-h-72 overflow-y-auto">
                      {events.map((ev) => (
                        <div key={ev.id} className="border-b border-neutral-900 pb-1 flex items-start gap-2">
                          <span className="text-neutral-500 whitespace-nowrap">
                            [{new Date(ev.timestamp).toLocaleTimeString()}]
                          </span>
                          <span className="text-neutral-300 font-bold whitespace-nowrap">
                            [{ev.source}]
                          </span>
                          <span className="text-white">{ev.message}</span>
                        </div>
                      ))}
                    </div>
                  </AsciiBox>
                </div>
              </div>
            )}

            {activeTab === "graphify" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 space-y-6">
                  <AsciiBox
                    title="GRAPHIFY_KNOWLEDGE_GRAPH // ZERO_TOKEN_AST"
                    rightLabel={`NODES: ${graph.node_count || 0} | EDGES: ${graph.edge_count || 0}`}
                  >
                    <form onSubmit={handleRunGraphQuery} className="flex flex-wrap gap-2 mb-4">
                      <select
                        value={graphMode}
                        onChange={(e) => setGraphMode(e.target.value)}
                        className="border border-white px-3 py-1.5"
                      >
                        <option value="query">graphify query</option>
                        <option value="explain">graphify explain</option>
                        <option value="path">graphify path</option>
                      </select>
                      <input
                        value={graphQuery}
                        onChange={(e) => setGraphQuery(e.target.value)}
                        placeholder="SYMBOL_OR_QUERY"
                        className="flex-1 border border-white px-3 py-1.5"
                      />
                      {graphMode === "path" && (
                        <input
                          value={graphTarget}
                          onChange={(e) => setGraphTarget(e.target.value)}
                          placeholder="TARGET_SYMBOL"
                          className="border border-white px-3 py-1.5"
                        />
                      )}
                      <button
                        type="submit"
                        className="px-4 py-1.5 border border-white bg-white text-black font-bold hover:bg-black hover:text-white"
                      >
                        [EXEC_QUERY]
                      </button>
                    </form>

                    {graphResult && (
                      <pre className="border border-white p-3 bg-neutral-950 whitespace-pre-wrap mb-4">
                        {graphResult}
                      </pre>
                    )}

                    <div className="space-y-1.5 max-h-96 overflow-y-auto">
                      {(graph.nodes || []).map((n) => (
                        <div key={n.id} className="border border-neutral-700 p-2 flex items-center justify-between">
                          <div>
                            <span className="font-bold mr-2">[{String(n.type).toUpperCase()}]</span>
                            <span>{n.signature || n.label}</span>
                            {n.file && <span className="text-neutral-500 ml-2">({n.file})</span>}
                          </div>
                          <span className="text-neutral-400">DEG:{n.degree}</span>
                        </div>
                      ))}
                    </div>
                  </AsciiBox>
                </div>

                <div className="lg:col-span-5">
                  <AsciiBox title="PRE_COMPILED // GRAPH_REPORT.MD">
                    <pre className="border border-neutral-700 p-3 bg-neutral-950 whitespace-pre-wrap overflow-x-auto">
                      {state.graph_report_markdown || "NO_GRAPH_REPORT_GENERATED"}
                    </pre>
                  </AsciiBox>
                </div>
              </div>
            )}

            {activeTab === "qa" && (
              <AsciiBox
                title="3_LAYER_AUTONOMOUS_QA_&_PLAYWRIGHT_INSPECTOR"
                rightLabel={`RUNS: ${qa_reports.length}`}
              >
                {qa_reports.length === 0 ? (
                  <div className="border border-dashed border-neutral-600 p-6 text-center text-neutral-400">
                    &gt; NO_QA_REPORTS_YET. Tasks automatically run Static AST, Pytest, and Headless Playwright checks upon submission.
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {qa_reports.map((rep) => (
                      <div key={rep.id} className="border border-white p-4 space-y-3">
                        <div className="flex items-center justify-between border-b border-neutral-700 pb-2">
                          <div>
                            <div className="text-neutral-400">{rep.task_id} // ATTEMPT #{rep.attempt}</div>
                            <div className="font-bold">
                              {rep.overall_passed ? "[PASS] ALL_3_LAYERS_VERIFIED" : "[FAIL] AUTO_RETRY_SCHEDULED"}
                            </div>
                          </div>
                          <StatusTag status={rep.overall_passed ? "completed" : "failed"} />
                        </div>

                        <div className="grid grid-cols-3 gap-2 text-center">
                          <div className="border border-white p-1.5 font-bold">
                            L1_AST: {rep.static_passed ? "OK" : "ERR"}
                          </div>
                          <div className="border border-white p-1.5 font-bold">
                            L2_PYTEST: {rep.unit_passed ? "OK" : "ERR"}
                          </div>
                          <div className="border border-white p-1.5 font-bold">
                            L3_BROWSER: {rep.playwright_passed ? "OK" : "ERR"}
                          </div>
                        </div>

                        <details>
                          <summary className="cursor-pointer font-bold">
                            [+] VIEW_QA_STDOUT_LOGS
                          </summary>
                          <pre className="mt-2 border border-neutral-700 p-2 bg-neutral-950 whitespace-pre-wrap max-h-48 overflow-y-auto">
                            {rep.logs}
                          </pre>
                        </details>
                      </div>
                    ))}
                  </div>
                )}
              </AsciiBox>
            )}

            {activeTab === "contracts" && (
              <AsciiBox title="SHARED_INTERFACE_SPECIFICATION // CONTRACTS.MD">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-neutral-400">
                    Review or edit the shared module &amp; function signatures before unlocking autonomous execution:
                  </span>
                  <button
                    onClick={handleApprovePlan}
                    className="px-4 py-1.5 border border-white bg-white text-black font-bold hover:bg-black hover:text-white"
                  >
                    [ SAVE_&_APPROVE_CONTRACTS ]
                  </button>
                </div>
                <textarea
                  rows={18}
                  value={contractsDraft}
                  onChange={(e) => setContractsDraft(e.target.value)}
                  className="w-full border border-white p-4 text-xs"
                />
              </AsciiBox>
            )}

            {activeTab === "internet" && (
              <AsciiBox title="MCP_WEB_SEARCH_&_DOCUMENTATION_BRIDGE">
                <form onSubmit={handleWebSearch} className="flex gap-2 mb-4">
                  <input
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="SEARCH_QUERY..."
                    className="flex-1 border border-white px-3 py-1.5"
                  />
                  <button
                    type="submit"
                    disabled={searching}
                    className="px-4 py-1.5 border border-white bg-white text-black font-bold hover:bg-black hover:text-white"
                  >
                    {searching ? "[SEARCHING...]" : "[EXEC_WEB_SEARCH]"}
                  </button>
                </form>
                <div className="space-y-2">
                  {searchResults.map((r, i) => (
                    <div key={i} className="border border-neutral-700 p-3">
                      <div className="font-bold">&gt; {r.title}</div>
                      <div className="text-neutral-500 truncate">{r.url}</div>
                      <p className="text-neutral-300 mt-1">{r.snippet}</p>
                    </div>
                  ))}
                </div>
              </AsciiBox>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
