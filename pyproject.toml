[project]
name = "funguys"
version = "0.1.0"
description = "Multiplayer, usage-aware Multi-AI Collaborative Software Engineering Platform with Graphify AST graphs & Autonomous QA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "typer>=0.12.5",
    "rich>=13.9.2",
    "networkx>=3.4.2",
    "beautifulsoup4>=4.12.3",
    "playwright>=1.48.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
funguys = "funguys.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
